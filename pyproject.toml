[project]
name = "nitropenguin"
version = "0.1.0"
description = "NitroSense features for the Acer Nitro 5 (AN515-45) on Linux: battery limiter, keyboard RGB, fan control"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.gui-scripts]
nitropenguin = "nitrotool.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nitrotool"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["nitrotool"]
# facer_rgb.py is vendored from the upstream community tool; leave it as-is.
extend-exclude = ["bin/facer_rgb.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["nitrotool"]
